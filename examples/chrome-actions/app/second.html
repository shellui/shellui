<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Chrome actions — Second</title>
    <link
      rel="stylesheet"
      href="/styles.css"
    />
  </head>
  <body>
    <main class="page">
      <h1>Second contentView</h1>
      <p class="lead">
        Independent action set for this iframe. Shell-navigating away from Home cleared that view’s
        chrome; this page sets its own on mount.
      </p>
      <p
        id="log"
        class="log"
        aria-live="polite"
      >
        Waiting for SDK…
      </p>
      <div class="row">
        <button
          type="button"
          id="btn-clear"
        >
          Clear this view’s actions
        </button>
      </div>
    </main>
    <script
      type="module"
      src="/second.js"
    ></script>
  </body>
</html>

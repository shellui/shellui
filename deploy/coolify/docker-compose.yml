        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'celery', '-A', 'config', 'inspect', 'ping', '-t', '10']
      interval: 30s
      timeout: 25s
      retries: 10
      start_period: 40s

  email:

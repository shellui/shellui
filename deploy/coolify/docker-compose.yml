      - EMAIL_HASH_PEPPER=${SERVICE_PASSWORD_64_EMAILPEPPER}
      - EMAIL_AUTH_LINK_HOSTS=${SERVICE_FQDN_IDENTITY}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@shellui.com}
      - DEFAULT_FROM_NAME=${DEFAULT_FROM_NAME:-Shellui}
      - SETUP_TOKEN=${EMAIL_SETUP_TOKEN:-}
      - CORS_ALLOW_ALL_ORIGINS=${EMAIL_CORS_ALLOW_ALL_ORIGINS:-false}
      - CORS_ALLOW_CREDENTIALS=${EMAIL_CORS_ALLOW_CREDENTIALS:-false}
      - ACTIONS_WEBHOOK_ALLOW_PRIVATE=${EMAIL_ACTIONS_WEBHOOK_ALLOW_PRIVATE:-false}
      - ACTIONS_WEBHOOK_RETRY_LEASE_SECONDS=${EMAIL_ACTIONS_WEBHOOK_RETRY_LEASE_SECONDS:-120}
    volumes:
      - email-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  email-worker:
    image: ${EMAIL_IMAGE:-shellui/email-service:0.2.0}
    command: ['worker']
    environment:
      - DEBUG=${DEBUG:-false}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-false}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=${SECURE_HSTS_INCLUDE_SUBDOMAINS:-true}
      - SECURE_HSTS_PRELOAD=${SECURE_HSTS_PRELOAD:-false}
      - POSTGRES_SSL_REQUIRE=${POSTGRES_SSL_REQUIRE:-false}
      - SECRET_KEY=${SERVICE_PASSWORD_64_EMAILSECRET}
      - POSTGRES_DATABASE_URL=postgresql://email:${SERVICE_PASSWORD_64_EMAILDB}@postgres:5432/email
      - REDIS_URL=${EMAIL_REDIS_URL:-redis://redis:6379/3}
      - SCHEDULER_ENABLED=true
      - EMAIL_WORKERS_ENABLED=true
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL:-http://identity:8000}
      - IDENTITY_JWKS=${IDENTITY_JWKS:?}
      - IDENTITY_ISSUER=${SERVICE_URL_IDENTITY}
      - IDENTITY_AUDIENCE=${JWT_AUDIENCE:-shellui}
      - JWT_ALGORITHMS=${JWT_ALGORITHMS:-RS256}
      - PUBLIC_BASE_URL=${SERVICE_URL_EMAIL}
      - EMAIL_FALLBACK_PROVIDER=${EMAIL_FALLBACK_PROVIDER:-none}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-}
      - EMAIL_MAX_DOCUMENT_BYTES=${EMAIL_MAX_DOCUMENT_BYTES:-524288}
      - EMAIL_MAX_RECIPIENTS=${EMAIL_MAX_RECIPIENTS:-50}
      - EMAIL_MAX_BATCH_ITEMS=${EMAIL_MAX_BATCH_ITEMS:-500}
      - EMAIL_MAX_VARIABLES_BYTES=${EMAIL_MAX_VARIABLES_BYTES:-8192}
      - EMAIL_BROADCAST_MAX_RECIPIENTS=${EMAIL_BROADCAST_MAX_RECIPIENTS:-10000}
      - EMAIL_BROADCAST_STEP_SECONDS=${EMAIL_BROADCAST_STEP_SECONDS:-20}
      - EMAIL_TURNSTILE_VERIFY_URL=${EMAIL_TURNSTILE_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}
      - EMAIL_ALLOW_FAKE_PROVIDER=${EMAIL_ALLOW_FAKE_PROVIDER:-false}
      - EMAIL_CREDENTIALS_KEY=${SERVICE_REALBASE64_32_EMAILCREDENTIALS}
      - EMAIL_VARIABLES_KEY=${SERVICE_REALBASE64_32_EMAILVARIABLES}
      - EMAIL_HASH_PEPPER=${SERVICE_PASSWORD_64_EMAILPEPPER}
      - EMAIL_AUTH_LINK_HOSTS=${SERVICE_FQDN_IDENTITY}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@shellui.com}
      - DEFAULT_FROM_NAME=${DEFAULT_FROM_NAME:-Shellui}
      - ACTIONS_WEBHOOK_ALLOW_PRIVATE=${EMAIL_ACTIONS_WEBHOOK_ALLOW_PRIVATE:-false}
      - ACTIONS_WEBHOOK_RETRY_LEASE_SECONDS=${EMAIL_ACTIONS_WEBHOOK_RETRY_LEASE_SECONDS:-120}
    volumes:
      - email-data:/app/data
    depends_on:
      email:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'celery', '-A', 'config', 'inspect', 'ping', '-t', '10']
      interval: 30s
      timeout: 25s
      retries: 10
      start_period: 40s

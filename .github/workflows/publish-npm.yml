name: Publish to npm

# Publishes @shellui/sdk, @shellui/core and @shellui/cli when a GitHub release
# is published for a v* tag. Uses npm trusted publishing (OIDC): no npm token
# is stored in the repository. Each package is configured on npmjs.com to trust
# this workflow file and the "npm" environment.

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@shellui/cli
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi
          for pkg in sdk core cli; do
            v="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$v" != "$pkg_version" ]; then
              echo "packages/$pkg is at $v, expected $pkg_version"
              exit 1
            fi
          done
          echo "VERSION=$pkg_version" >> "$GITHUB_ENV"

      - name: Choose dist-tag
        run: |
          case "$VERSION" in
            *-*)
              pre="${VERSION#*-}"
              tag="$(echo "${pre%%[.-]*}" | tr '[:upper:]' '[:lower:]')"
              [ -n "$tag" ] || tag=pre
              ;;
            *) tag=latest ;;
          esac
          echo "Publishing $VERSION with dist-tag $tag"
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@11 && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changelog
        run: pnpm run changelog:check

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm run build:all

      # pnpm pack rewrites workspace:* dependencies to the real version.
      - name: Pack packages
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          for pkg in sdk core cli; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/packs")
          done
          ls -l "$RUNNER_TEMP/packs"

      # Order matters: cli depends on core, core depends on sdk.
      # A version already on npm is skipped so the job can be rerun safely.
      - name: Publish to npm
        run: |
          for pkg in sdk core cli; do
            name="@shellui/$pkg"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published, skipping"
              continue
            fi
            tarball="$RUNNER_TEMP/packs/shellui-$pkg-$VERSION.tgz"
            npm publish "$tarball" --access public --tag "$DIST_TAG" --provenance
          done

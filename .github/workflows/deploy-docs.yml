name: Deploy Docs to GitHub Pages

# The site at docs.shellui.com includes the docs of every Shellui service
# (identity, storage, hosting, email). They are fetched from each service repo
# at build time by tools/docusaurus/scripts/fetch-service-docs.js.
#
# The build job has contents: read and does not keep checkout credentials.
# The deploy job only has Pages permissions and does not run the site build.

on:
  push:
    branches:
      - main
      - develop
      - master
    paths:
      - 'docs/**'
      - 'tools/docusaurus/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/docusaurus/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-docs.yml'
  # Older service repos send this event when their docs change on main.
  # Example: gh api repos/shellui/shellui/dispatches -f event_type=service-docs-updated
  repository_dispatch:
    types:
      - service-docs-updated
  workflow_dispatch:
    inputs:
      service:
        description: Service that asked for a rebuild
        required: false
        type: string
      sha:
        description: Commit in the service repository
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # CI never has sibling checkouts, so always clone service docs from GitHub.
      DOCS_SOURCE: remote
      # Override per service with repository variables, for example IDENTITY_DOCS_REF=v1.2.0.
      IDENTITY_DOCS_REF: ${{ vars.IDENTITY_DOCS_REF || 'main' }}
      STORAGE_DOCS_REF: ${{ vars.STORAGE_DOCS_REF || 'main' }}
      HOSTING_DOCS_REF: ${{ vars.HOSTING_DOCS_REF || 'main' }}
      EMAIL_DOCS_REF: ${{ vars.EMAIL_DOCS_REF || 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log trigger
        if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_BY: ${{ github.event.client_payload.service || github.event.inputs.service }}
          SOURCE_SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha }}
        run: |
          echo "Rebuild requested by: ${REQUESTED_BY:-unknown}"
          echo "Source commit: ${SOURCE_SHA:-unknown}"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch service docs
        run: pnpm run docs:fetch

      - name: Build documentation
        run: pnpm run build:sdk && pnpm --dir tools/docusaurus run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: tools/docusaurus/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Shellui Alpine App</title>
  </head>
  <body>
    <div
      id="app"
      x-data="shelluiHome"
    >
      <main class="home">
        <p class="eyebrow">Shellui</p>
        <h1 x-text="t('title')"></h1>
        <p
          class="blurb"
          x-text="t('blurb')"
        ></p>
        <dl class="meta">
          <div>
            <dt x-text="t('themeLabel')"></dt>
            <dd x-text="themeLabel"></dd>
          </div>
          <div>
            <dt x-text="t('languageLabel')"></dt>
            <dd x-text="languageLabel"></dd>
          </div>
        </dl>
        <p
          class="hint"
          x-text="t('hint')"
        ></p>
      </main>
    </div>
    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>

[package]
name = "shellui"
version = "0.7.0"
default-run = "Shellui"
description = "Shellui desktop app"
authors = ["Shellui"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "Shellui"
path = "src/main.rs"
